services:
  postgres:
    image: postgres:16
    container_name: openopportunity-postgres
    environment:
      POSTGRES_DB: openopportunity
      POSTGRES_USER: openopportunity
      POSTGRES_PASSWORD: openopportunity
    ports:
      - '5432:5432'
    volumes:
      - openopportunity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openopportunity']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backs app.search.provider=elasticsearch (see com.openopportunity.search) — the "search"
  # profile keeps this out of a bare `docker compose up`/`up -d` (which only starts Postgres,
  # matching app.search.provider's "postgres" default — nothing here needs Elasticsearch
  # running). Start it explicitly with `docker compose up -d elasticsearch` (naming a profiled
  # service directly still starts it, profile or not) or `docker compose --profile search up -d`.
  # Security is disabled here purely for local-dev simplicity, same reasoning as Postgres's
  # plaintext password above; Elastic Cloud (where this shifts to in a real deployment) has it on
  # by default and reached via an API key instead (see application.properties).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: openopportunity-elasticsearch
    profiles: ['search']
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - openopportunity-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  # Backs app.storage.provider=gcs (see com.openopportunity.storage) — a real Google Cloud
  # Storage API emulator, not a generic S3-alike, so the backend's google-cloud-storage client
  # code talks to it identically to how it'll talk to real GCS in production; only the
  # host/credentials config differs (see GcsStorageConfig). Behind the "cdn" profile, same
  # opt-in-only reasoning as Elasticsearch's "search" profile above — app.storage.provider
  # defaults to "local" (disk), which never touches this container.
  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: openopportunity-fake-gcs
    command: -scheme http -public-host localhost:4443
    ports:
      - '4443:4443'
    volumes:
      - openopportunity-gcs-data:/data
    profiles: ['cdn']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4443/storage/v1/b']
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs app.cache.provider=redis (see com.openopportunity.config.RedisCacheConfig) — shares
  # cache entries across instances instead of each one keeping its own in-process Caffeine cache
  # (see CacheConfig). Behind the "cache" profile, same opt-in-only reasoning as the other
  # services above — app.cache.provider defaults to "caffeine", which never touches this
  # container. No password locally, same local-dev-simplicity reasoning as Postgres/Elasticsearch
  # above; a real deployment (Memorystore or similar) sets REDIS_PASSWORD instead.
  redis:
    image: redis:7-alpine
    container_name: openopportunity-redis
    ports:
      - '6379:6379'
    volumes:
      - openopportunity-redis-data:/data
    profiles: ['cache']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openopportunity-postgres-data:
  openopportunity-elasticsearch-data:
  openopportunity-gcs-data:
  openopportunity-redis-data:
