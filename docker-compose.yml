services:
  # wal_level=replica/max_wal_senders/max_replication_slots are harmless to run unconditionally
  # (a single-node setup with no replica connected just retains slightly more WAL, effectively
  # free for local dev) and only actually matter once postgres-replica below connects — so they
  # live here rather than being gated behind the "read-replica" profile too. primary-init.sh
  # (see docker/postgres-replica/) creates the replication role and pg_hba.conf rule the replica
  # needs; it only runs once, the first time this container starts with an empty data volume.
  postgres:
    image: postgres:16
    container_name: openopportunity-postgres
    command:
      [
        'postgres',
        '-c',
        'wal_level=replica',
        '-c',
        'max_wal_senders=5',
        '-c',
        'max_replication_slots=5',
        '-c',
        'hot_standby=on',
      ]
    environment:
      POSTGRES_DB: openopportunity
      POSTGRES_USER: openopportunity
      POSTGRES_PASSWORD: openopportunity
      # Local-dev-only plaintext password, same reasoning as POSTGRES_PASSWORD above — read by
      # primary-init.sh to create the replication role postgres-replica connects as.
      POSTGRES_REPLICATION_PASSWORD: replicator
    ports:
      - '5432:5432'
    volumes:
      - openopportunity-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-replica/primary-init.sh:/docker-entrypoint-initdb.d/primary-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openopportunity']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backs app.datasource.read-replica.enabled=true (see
  # com.openopportunity.config.ReadReplicaDataSourceConfig) — a streaming-replication standby of
  # the postgres service above, kept in sync automatically by Postgres itself rather than any
  # application code. Behind the "read-replica" profile, same opt-in-only reasoning as the other
  # services in this file — app.datasource.read-replica.enabled defaults to false, which never
  # touches this container. Start it with `docker compose --profile read-replica up -d` (needs
  # the primary healthy first, which depends_on below waits for). replica-entrypoint.sh (see
  # docker/postgres-replica/) clones the primary via pg_basebackup on first start, then this
  # behaves like a normal postgres server in continuous hot-standby/read-only mode.
  postgres-replica:
    image: postgres:16
    container_name: openopportunity-postgres-replica
    profiles: ['read-replica']
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['bash', '/docker-entrypoint-replica.sh']
    environment:
      PRIMARY_HOST: postgres
      PGPASSWORD: replicator
    ports:
      - '5433:5432'
    volumes:
      - openopportunity-postgres-replica-data:/var/lib/postgresql/data
      - ./docker/postgres-replica/replica-entrypoint.sh:/docker-entrypoint-replica.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openopportunity']
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs app.search.provider=elasticsearch (see com.openopportunity.search) — the "search"
  # profile keeps this out of a bare `docker compose up`/`up -d` (which only starts Postgres,
  # matching app.search.provider's "postgres" default — nothing here needs Elasticsearch
  # running). Start it explicitly with `docker compose up -d elasticsearch` (naming a profiled
  # service directly still starts it, profile or not) or `docker compose --profile search up -d`.
  # Security is disabled here purely for local-dev simplicity, same reasoning as Postgres's
  # plaintext password above; Elastic Cloud (where this shifts to in a real deployment) has it on
  # by default and reached via an API key instead (see application.properties).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: openopportunity-elasticsearch
    profiles: ['search']
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - openopportunity-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  # Backs app.storage.provider=gcs (see com.openopportunity.storage) — a real Google Cloud
  # Storage API emulator, not a generic S3-alike, so the backend's google-cloud-storage client
  # code talks to it identically to how it'll talk to real GCS in production; only the
  # host/credentials config differs (see GcsStorageConfig). Behind the "cdn" profile, same
  # opt-in-only reasoning as Elasticsearch's "search" profile above — app.storage.provider
  # defaults to "local" (disk), which never touches this container.
  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: openopportunity-fake-gcs
    command: -scheme http -public-host localhost:4443
    ports:
      - '4443:4443'
    volumes:
      - openopportunity-gcs-data:/data
    profiles: ['cdn']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4443/storage/v1/b']
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs app.cache.provider=redis (see com.openopportunity.config.RedisCacheConfig) — shares
  # cache entries across instances instead of each one keeping its own in-process Caffeine cache
  # (see CacheConfig). Behind the "cache" profile, same opt-in-only reasoning as the other
  # services above — app.cache.provider defaults to "caffeine", which never touches this
  # container. No password locally, same local-dev-simplicity reasoning as Postgres/Elasticsearch
  # above; a real deployment (Memorystore or similar) sets REDIS_PASSWORD instead.
  redis:
    image: redis:7-alpine
    container_name: openopportunity-redis
    ports:
      - '6379:6379'
    volumes:
      - openopportunity-redis-data:/data
    profiles: ['cache']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs app.events.provider=kafka (see com.openopportunity.notification) — domain-event
  # delivery (currently: notification emails) goes through a real Kafka topic instead of an
  # in-process thread pool. Single-node KRaft mode (broker + controller combined, no Zookeeper).
  # Behind the "events" profile, same opt-in-only reasoning as the other services above —
  # app.events.provider defaults to "inprocess", which never touches this container.
  kafka:
    image: apache/kafka:3.9.0
    container_name: openopportunity-kafka
    profiles: ['events']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9092:9092'
    volumes:
      - openopportunity-kafka-data:/tmp/kraft-combined-logs

volumes:
  openopportunity-postgres-data:
  openopportunity-postgres-replica-data:
  openopportunity-elasticsearch-data:
  openopportunity-gcs-data:
  openopportunity-redis-data:
  openopportunity-kafka-data:
