plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.openopportunity'
version = '0.0.1-SNAPSHOT'
description = 'OpenOpportunity backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// Verifies "Sign in with Google" ID tokens against Google's public keys (GoogleIdTokenVerifier).
	implementation 'com.google.api-client:google-api-client:2.7.0'
	// Generates mock-interview questions via the Claude API (com.openopportunity.mockinterview.MockInterviewQuestionService).
	implementation 'com.anthropic:anthropic-java:2.49.0'
	// Candidate billing checkout/payments (com.openopportunity.billing.CandidateBillingService).
	implementation 'com.razorpay:razorpay-java:1.4.9'
	// Generates the candidate billing invoice PDF (com.openopportunity.billing.InvoicePdfGenerator);
	// also used to extract text from PDF resumes for the "view as web view" HTML preview
	// (com.openopportunity.auth.ResumeHtmlRenderer).
	implementation 'org.apache.pdfbox:pdfbox:2.0.37'
	// Reads .docx/.doc resumes to render them as HTML for the "view as web view" preview
	// (com.openopportunity.auth.ResumeHtmlRenderer) — poi-scratchpad adds legacy binary .doc
	// (HWPF) support on top of poi-ooxml's .docx (XWPF) support.
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	implementation 'org.apache.poi:poi-scratchpad:5.5.1'
	// Downscales candidate photos/company logos on upload before they're stored (see
	// com.openopportunity.storage.AvatarImageResizer) — both only ever render as small avatars.
	implementation 'net.coobird:thumbnailator:0.4.20'
	// Job search backend once app.search.provider=elasticsearch (see com.openopportunity.search)
	// — the RestClient this configures is a plain HTTP client with no persistent connection to
	// eagerly open, unlike Lettuce/Redis (see RedisCacheConfig's comment for that contrast), so
	// having this on the classpath is harmless even when the property stays at its "postgres"
	// default and no Elasticsearch instance exists locally.
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	// File storage backend once app.storage.provider=gcs (see com.openopportunity.storage) —
	// the Storage client this builds is a plain REST client (see GcsStorageConfig), not
	// something that eagerly opens a connection, and it's only ever constructed at all behind
	// that same @ConditionalOnProperty gate — harmless on the classpath at the "local" default.
	implementation 'com.google.cloud:google-cloud-storage:2.71.0'
	// Cache backend once app.cache.provider=redis (see com.openopportunity.config.RedisCacheConfig)
	// — unlike the two HTTP-based clients above, Lettuce (the default Spring Data Redis client)
	// eagerly opens a connection at startup, which is exactly why RedisCacheConfig excludes
	// RedisAutoConfiguration and builds its connection factory manually with eager
	// initialization disabled; see OpenOpportunityApplication's exclude list.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// Notification-delivery event bus once app.events.provider=kafka (see
	// com.openopportunity.notification) — the KafkaTemplate this configures is backed by the
	// plain Kafka Java client, which (unlike Lettuce) resolves broker metadata lazily on first
	// send rather than eagerly connecting at bean-creation time, and KafkaNotificationEventPublisher
	// (the only thing that ever calls send()) only exists behind that same @ConditionalOnProperty
	// gate — harmless on the classpath at the "inprocess" default. Verified: the app starts
	// cleanly with this on the classpath and no Kafka broker running.
	implementation 'org.springframework.kafka:spring-kafka'
	runtimeOnly 'org.postgresql:postgresql'
	// Lets the JDBC URL connect through the Unix socket Cloud Run mounts at /cloudsql
	// (see infra/run.tf) instead of a raw TCP host:port — only exercised in that
	// deployment, harmless locally where it's never invoked.
	runtimeOnly 'com.google.cloud.sql:postgres-socket-factory:1.28.4'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
