spring.application.name=OpenOpportunity

# Cloud Run injects $PORT and expects the container to listen on it; SERVER_PORT isn't
# set there, so this has to be resolved from PORT explicitly. Defaults to 8080 locally.
server.port=${PORT:8080}

# Gzips outgoing responses over 2KB (Spring Boot's default min-response-size) whose content type
# matches the default compressible list (application/json among them) — job/idea/candidate
# search results are exactly the kind of repeated, sizeable JSON array this helps most.
server.compression.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/openopportunity
spring.datasource.username=openopportunity
spring.datasource.password=openopportunity

# Flyway owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
# Actuator endpoints are served by a separate handler mapping from @RestControllers
# and don't go through the CorsConfigurationSource bean (see WebConfig) — they need
# their own CORS config to be reachable from the Vite dev server.
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET

app.cors.allowed-origins=http://localhost:5173

# Used to build the link inside password reset emails (see AuthService.requestPasswordReset) —
# distinct from app.cors.allowed-origins since that one's CORS-specific and may list more than
# one origin in some deployments. Override via APP_FRONTEND_BASE_URL in any real deployment.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Dev-only secret — override via APP_JWT_SECRET in any real deployment. Must be >= 32
# bytes (256 bits) for HS256. (The env var substitution below is load-bearing: without it,
# setting APP_JWT_SECRET would silently do nothing and every deployment would sign tokens
# with this same committed secret.)
app.jwt.secret=${APP_JWT_SECRET:a403438eb69850b8afda1af1bc448e65849fe6331e3e6018b397aa8f73ccf4c1}
app.jwt.access-token-expiry-minutes=15
app.jwt.refresh-token-expiry-days=30

# The refresh-token cookie's Secure flag — false so it still works over plain http on
# localhost; set true (or override via APP_SECURITY_COOKIE_SECURE) once served over TLS.
app.security.cookie-secure=false

# Lax works locally because localhost:5173 -> localhost:8080 counts as same-site
# (same host, different port). It does NOT work once frontend and backend are on
# genuinely different sites (e.g. a *.run.app backend + a separate frontend host) —
# a Lax cookie is simply never attached to a cross-site fetch/XHR call, so the
# refresh flow silently breaks. Override to None (which requires Secure=true, hence
# also flipping APP_SECURITY_COOKIE_SECURE) via APP_SECURITY_COOKIE_SAME_SITE in that
# deployment shape.
app.security.cookie-same-site=Lax

# Throttles the unauthenticated auth endpoints most exposed to abuse — login/register/Google
# sign-in and forgot/reset password (see AuthRateLimitFilter). In-memory and per-IP, so this is a
# reasonable default for the app's current single-instance deployment, not a hard limit that
# scales to a real multi-instance one.
app.security.rate-limit.enabled=true
app.security.rate-limit.max-requests=20
app.security.rate-limit.window-minutes=5

# Where the public job search's filtering/ranking actually runs (see com.openopportunity.search)
# — "postgres" (the default) queries the jobs table directly and needs nothing extra running;
# "elasticsearch" queries an Elasticsearch index instead (kept in sync by JobIndexingService) and
# gets real relevance-ranked results instead of falling back to recency. Run `docker compose up
# -d elasticsearch` for a local instance (security disabled there for local-dev simplicity, see
# docker-compose.yml), or point spring.elasticsearch.* at Elastic Cloud in a real deployment.
app.search.provider=${SEARCH_PROVIDER:postgres}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
# Elastic Cloud auth is normally an API key rather than a username/password (its default
# security posture, unlike this app's deliberately-insecure local container) — only read when set.
spring.elasticsearch.api-key=${ELASTICSEARCH_API_KEY:}

# Separately caps how many password-reset emails one target address can receive, independent of
# the requester's source IP (see PasswordResetRateLimiter) — the IP-keyed limiter above doesn't
# stop an attacker with rotating IPs from email-bombing one victim's inbox, or from exhausting
# MAIL_HOST's daily send quota (e.g. Gmail's ~500/day) and breaking transactional email for
# everyone. Reuses app.security.rate-limit.enabled as its on/off switch.
app.security.password-reset-rate-limit.max-requests=5
app.security.password-reset-rate-limit.window-minutes=60

# Caps how many mock-interview question-generation requests one candidate can make (see
# MockInterviewQuestionRateLimiter) — that endpoint only requires a free candidate account and,
# unlike the request bodies above, a cache miss triggers a real, metered call to the Claude API.
# Without this, varying skills/industry/experienceLevel per request to always miss
# MockInterviewQuestionService's DB question bank would let an attacker run up the Anthropic
# bill in a tight loop. Reuses app.security.rate-limit.enabled as its on/off switch.
app.security.mock-interview-question-rate-limit.max-requests=10
app.security.mock-interview-question-rate-limit.window-minutes=60

# Local dev only — seeds one admin account on startup if it doesn't exist yet (see
# AdminSeeder; there's no admin self-registration flow by design). Override via
# APP_ADMIN_SEED_EMAIL / APP_ADMIN_SEED_PASSWORD in any real deployment. (Same load-bearing
# env var substitution as app.jwt.secret above — without it this well-known password would
# seed every deployment's admin account, not just local dev.)
app.admin.seed-email=${APP_ADMIN_SEED_EMAIL:admin@openopportunity.com}
app.admin.seed-password=${APP_ADMIN_SEED_PASSWORD:AdminPass123!}

# "Sign in with Google" (candidate-only, see GoogleTokenVerifierService) verifies the ID
# token audience against this OAuth 2.0 Client ID. Create one at
# https://console.cloud.google.com/apis/credentials (Application type: Web application;
# Authorized JavaScript origins: http://localhost:5173 and any deployed frontend origin).
# Blank locally disables the feature — GoogleTokenVerifierService throws instead of silently
# accepting tokens it can't actually verify.
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:482829708882-v20vkkttvit8393qj0k849vd70k6l4a5.apps.googleusercontent.com}

# Where uploaded files (resumes, photos, logos, certificates, mock-interview recordings) live —
# see com.openopportunity.storage. "local" (the default) writes to disk, self-contained for dev
# per the local-first build philosophy; "gcs" backs onto Google Cloud Storage (GcsFileStorageService)
# — fake-gcs-server locally (see docker-compose.yml's "cdn" profile: `docker compose up -d
# fake-gcs-server`) or real GCS in any deployment (emulator-host stays blank there, so it falls
# back to Application Default Credentials).
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.root-dir=${STORAGE_ROOT_DIR:uploads}
app.storage.gcs.bucket=${STORAGE_GCS_BUCKET:openopportunity-uploads}
app.storage.gcs.emulator-host=${STORAGE_GCS_EMULATOR_HOST:}
app.storage.gcs.project-id=${STORAGE_GCS_PROJECT_ID:openopportunity-local}
# 150MB accommodates mock interview recordings (see com.openopportunity.mockinterview); resumes
# still enforce their own tighter 5MB cap in CandidateProfileService.validate().
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# Caps how long CandidateSearchService.getResumeHtml will wait for PDFBox/POI to parse a resume
# (see AsyncConfig's resumeRenderExecutor) before giving up and failing the request — a
# pathological but validly-signed upload could otherwise tie up a thread parsing indefinitely.
app.resume-render.timeout-seconds=10

# Outbound SMTP backing com.openopportunity.mail.EmailService — the one place in the app that
# sends real email (password resets, in-app notification emails, community interest requests),
# all rendered through its shared branded HTML template. Blank MAIL_USERNAME/MAIL_PASSWORD
# locally means sends will fail with an auth error until real SMTP credentials are supplied via
# env vars — there's no local-first stand-in for an actual mail relay, unlike Postgres/file
# storage.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# The "from" address EmailService sets on every outgoing email, and (separately) the dedicated
# inbox that receives community interest requests. Override both via env vars in any real
# deployment; app.mail.from should be a verified sender for whichever SMTP provider MAIL_HOST
# points at.
app.mail.from=${APP_MAIL_FROM:no-reply@openopportunity.com}
app.community.contact-email=${APP_COMMUNITY_CONTACT_EMAIL:}

# Candidate billing checkout (see com.openopportunity.billing). Blank locally means
# CandidateBillingService.razorpayClient stays null — Free downgrade still works, paid-plan
# checkout fails gracefully with a 502 until real Razorpay test/live keys are supplied via env
# vars. key-id is also handed back to the frontend as-is (it's the publishable key); key-secret
# and webhook-secret never leave the backend.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
