name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# id-token: write is required by google-github-actions/auth's Workload Identity Federation flow
# (deploy job only) — no long-lived GCP service account key is stored anywhere in this repo.
permissions:
  contents: read
  id-token: write

jobs:
  backend:
    runs-on: ubuntu-latest
    # Matches the local dev Postgres exactly (see backend/src/main/resources/application.properties)
    # so the test suite's real-Postgres integration tests (see AuthControllerTest and friends)
    # run the same way here as on a developer's machine — no separate CI-only config needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openopportunity
          POSTGRES_PASSWORD: openopportunity
          POSTGRES_DB: openopportunity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openopportunity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=frontend
      - run: npm run format:check --workspace=frontend
      - run: npm run build --workspace=frontend

  # Only after both test jobs above pass, and only on an actual push to main (not a PR — a PR
  # from a fork wouldn't have access to the secrets/vars below anyway, and even from a branch in
  # this repo, deploying on every PR push would be surprising). See infra/README.md's "CI/CD"
  # section for the one-time setup this depends on (Workload Identity Federation, repo
  # variables/secrets) — none of that is automated here since it needs a human's own gcloud
  # credentials to create, same reasoning as every other one-time GCP setup step in this repo.
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and push backend image
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/openopportunity/backend:${{ github.sha }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4

      - name: terraform apply
        working-directory: infra
        # deploy.tfvars is tracked in git (see its own header comment) specifically so this step
        # applies whatever the repo currently says every scale/cost toggle should be — the same
        # file scripts/*.sh update locally. elastic_cloud_api_key is blank unless
        # ELASTIC_CLOUD_API_KEY is set as a repo secret, matching that variable's own
        # blank-means-unused default (see variables.tf) — harmless to always pass.
        #
        # alert_notification_email is passed here, not via deploy.tfvars, since (unlike every
        # other deploy.tfvars value) it's a personal email address and this repo is public — see
        # deploy.tfvars's own comment. Blank if ALERT_NOTIFICATION_EMAIL isn't set as a repo
        # variable, matching that variable's own blank-means-no-alerting default. Confirmed the
        # hard way: an earlier apply run without this planned to destroy every alert policy and
        # the notification channel, because as far as CI could see the email had never been set.
        env:
          TF_VAR_elastic_cloud_api_key: ${{ secrets.ELASTIC_CLOUD_API_KEY }}
        run: |
          terraform init -backend-config="bucket=openopportunity-tfstate"
          terraform apply -auto-approve \
            -var-file="deploy.tfvars" \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="backend_image=${{ steps.image.outputs.image }}" \
            -var="alert_notification_email=${{ vars.ALERT_NOTIFICATION_EMAIL }}"

      - name: Read deploy outputs
        id: tf
        run: |
          echo "backend_url=$(cd infra && terraform output -raw backend_url)" >> "$GITHUB_OUTPUT"
          # frontend_mode is a Terraform *input*, not an output — read it straight from
          # deploy.tfvars (the actual source of truth) the same way scripts/lib/deploy-tfvars.sh's
          # get_deploy_tfvar does, rather than round-tripping it through a Terraform output that
          # doesn't exist.
          echo "frontend_mode=$(grep '^frontend_mode' infra/deploy.tfvars | sed -E 's/^[^=]+=[[:space:]]*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Build frontend
        # VITE_GOOGLE_CLIENT_ID/VITE_POSTHOG_KEY/VITE_POSTHOG_HOST are optional repo variables
        # (see frontend/.env's own comments) — blank/unset here builds exactly like blank/unset
        # locally: GoogleSignInButton renders nothing, PostHog stays disabled
        # (src/lib/analytics.ts). Neither is sensitive enough to need a secret — both are public,
        # embedded-in-the-bundle tokens by design, same reasoning as GA's measurement ID.
        # VITE_GOOGLE_CLIENT_ID was missing from this list for a while — the comment claimed it
        # was handled but the env var was never actually passed, so every CI-built deploy
        # silently shipped with no "Continue with Google" button at all. Confirmed against a
        # real deploy, not caught by tests (nothing asserts the button renders).
        run: |
          npm ci
          VITE_API_BASE_URL="${{ steps.tf.outputs.backend_url }}" \
          VITE_GOOGLE_CLIENT_ID="${{ vars.GOOGLE_CLIENT_ID }}" \
          VITE_POSTHOG_KEY="${{ vars.POSTHOG_KEY }}" \
          VITE_POSTHOG_HOST="${{ vars.POSTHOG_HOST }}" \
          npm run build --workspace=frontend

      # firebase-tools reads GOOGLE_APPLICATION_CREDENTIALS (set by the auth step above) for
      # `firebase deploy` — this is the one step in this workflow I couldn't fully verify without
      # actually running it against real GCP/GitHub infrastructure, so watch this specifically on
      # the first real run. If it doesn't authenticate correctly, the documented fallback is a
      # `firebase login:ci`-generated token stored as a FIREBASE_TOKEN repo secret, passed via
      # `firebase deploy --token "${{ secrets.FIREBASE_TOKEN }}"` instead of relying on ADC — see
      # infra/README.md's CI/CD section.
      - name: Deploy frontend (firebase)
        if: steps.tf.outputs.frontend_mode == 'firebase'
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive

      - name: Deploy frontend (load-balancer)
        if: steps.tf.outputs.frontend_mode == 'load-balancer'
        run: |
          BUCKET="$(cd infra && terraform output -raw frontend_bucket)"
          gsutil -m rsync -r -d frontend/dist "gs://$BUCKET"
          # Best-effort — a fresh index.html should still reach users on its own CDN TTL even
          # if this fails for some reason, so this doesn't fail the whole deploy.
          gcloud compute url-maps invalidate-cdn-cache openopportunity-frontend \
            --path "/index.html" --async || true
